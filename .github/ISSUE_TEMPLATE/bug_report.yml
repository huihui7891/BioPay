name: 🐛 缺陷报告 (Bug Report)
description: 反馈 BioPay 的异常、崩溃或模拟失效等问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你反馈问题！在提交前，请先阅读 [项目文档](README.md) 并搜索 [已有的 Issues](https://github.com/your-username/BioPay/issues) 确认是否已有相同反馈。

  - type: input
    id: app_version
    attributes:
      label: BioPay 版本 / Commit Hash
      description: 你正在使用的 BioPay 版本或 Git Commit Hash 是什么？
      placeholder: "例如：v2.1.0 或 commit abc1234"
    validations:
      required: true

  - type: dropdown
    id: android_version
    attributes:
      label: Android 系统版本
      description: 你的设备运行的 Android 系统版本是？
      options:
        - "Android 16 (API 36)"
        - "Android 15 (API 35)"
        - "Android 14 (API 34)"
        - "Android 13 (API 33)"
        - "Android 12 / 12L (API 31/32)"
        - "Android 11 (API 30)"
        - "Android 10 (API 29)"
    validations:
      required: true

  - type: dropdown
    id: root_solution
    attributes:
      label: Root 方案与 LSPosed 框架
      description: 你使用的是哪种 Root 管理器与 Xposed 框架？
      options:
        - "KernelSU + LSPosed (API 102)"
        - "APatch + LSPosed (API 102)"
        - "Magisk + LSPosed (API 102)"
        - "其他 Root / Xposed 环境"
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: 设备机型与系统 ROM
      description: 你的设备型号与当前刷入的系统 ROM 是？
      placeholder: "例如：小米 13 Pro (HyperOS 1.0) / Google Pixel 7 (LineageOS 21)"
    validations:
      required: false

  - type: input
    id: target_app
    attributes:
      label: 目标应用名称与版本
      description: 出现问题的目标应用包名与版本号
      placeholder: "例如：微信 (com.tencent.mm) v8.0.72 / 云闪付 (com.unionpay) v10.2.1"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰明确地描述遇到的问题、异常表现或崩溃现象。
      placeholder: "请详细描述具体是哪个环节出现异常..."
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: 复现步骤
      description: 请提供详细的重现步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断日志与补充信息
      description: |
        建议从 Releases 下载带 -Debug 后缀的 APK，覆盖安装后复现问题，再通过对应应用「模块设置 → 异常诊断 → 导出」获取日志。
        将日志文件拖入此处上传；若无法导出，请说明原因。可补充相关模块、截图或录屏。测试结束后可覆盖安装正式版。