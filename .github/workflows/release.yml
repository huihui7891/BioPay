name: Release

# Run manually after bumping versionName in app/build.gradle.kts.
# Releases use v<versionName> tags and commit-based changelogs.
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: '补充更新说明或升级注意事项（可选）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.check_version.outputs.tag }}
      version_code: ${{ steps.check_version.outputs.version_code }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check version status
        id: check_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          test -n "$NAME" || { echo "error: versionName not found"; exit 1; }
          echo "Version: $NAME"
          if ! echo "$NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version '$NAME' is not a stable x.y.z release, skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n 1)
          test -n "$CODE" || { echo "error: versionCode not found"; exit 1; }
          TAG="v$NAME"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          if jq -e --arg tag "$TAG" --arg apk "BioPay-$TAG.apk" 'any(.[][]; .tag_name == $tag and .draft == false and .prerelease == false and any(.assets[]; .name == $apk and .size > 0))' "$RUNNER_TEMP/releases.json" > /dev/null; then
            echo "Release $TAG already published; checking module repository sync next."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "New unreleased version: $TAG"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        if: steps.check_version.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.check_version.outputs.tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          python3 .github/scripts/generate_changelog.py
          cat changelog.txt

      - name: Validate Gradle wrapper
        if: steps.check_version.outputs.changed == 'true'
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Java
        if: steps.check_version.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        if: steps.check_version.outputs.changed == 'true'
        run: chmod +x gradlew

      - name: Restore signing keystore
        if: steps.check_version.outputs.changed == 'true'
        env:
          BIOPAY_RELEASE_KEYSTORE_BASE64: ${{ secrets.BIOPAY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$BIOPAY_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$BIOPAY_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/biopay-release.keystore"

      - name: Build signed release APK
        if: steps.check_version.outputs.changed == 'true'
        env:
          BIOPAY_RELEASE_STORE_FILE: ${{ runner.temp }}/biopay-release.keystore
          BIOPAY_RELEASE_STORE_PASSWORD: ${{ secrets.BIOPAY_RELEASE_STORE_PASSWORD }}
          BIOPAY_RELEASE_KEY_ALIAS: ${{ secrets.BIOPAY_RELEASE_KEY_ALIAS }}
          BIOPAY_RELEASE_KEY_PASSWORD: ${{ secrets.BIOPAY_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew lintRelease assembleRelease --warning-mode fail
          APK_DIR="app/build/outputs/apk"
          mv "$APK_DIR/release/app-release.apk" "$APK_DIR/BioPay-${{ steps.check_version.outputs.tag }}.apk"
          ls -lh "$APK_DIR"

      - name: Verify release APK
        if: steps.check_version.outputs.changed == 'true'
        run: |
          APK=app/build/outputs/apk/BioPay-${{ steps.check_version.outputs.tag }}.apk
          test -s "$APK"
          # Not debuggable.
          ! unzip -p "$APK" AndroidManifest.xml | strings | grep -q 'debuggable'
          # Xposed entry must survive R8/shrinking with its real name.
          ENTRY=$(python3 -c "import zipfile,sys; print(zipfile.ZipFile(sys.argv[1]).read('META-INF/xposed/java_init.list').decode().strip())" "$APK")
          echo "Entry: $ENTRY"
          EXPECTED_ENTRY=$(python3 -c "from pathlib import Path; print(Path('app/src/main/resources/META-INF/xposed/java_init.list').read_text().strip())")
          test "$ENTRY" = "$EXPECTED_ENTRY"
          # Signature valid.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify "$APK"

      - name: Upload release mapping (private)
        if: steps.check_version.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-mapping-${{ steps.check_version.outputs.tag }}
          if-no-files-found: error
          retention-days: 90
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Publish GitHub Release
        if: steps.check_version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          name: BioPay ${{ steps.check_version.outputs.tag }}
          body_path: changelog.txt
          files: |
            app/build/outputs/apk/BioPay-${{ steps.check_version.outputs.tag }}.apk

  sync_module_repository:
    name: Sync LSPosed module repository
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: biopay-module-repository
      cancel-in-progress: false
    steps:
      - name: Check out listing source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Set MODULE_REPO_TOKEN to a token with Contents write access to
      # Xposed-Modules-Repo/io.github.kiriashi.biopay. GITHUB_TOKEN cannot write there.
      - name: Sync README, SUMMARY and signed release APK
        env:
          GH_TOKEN: ${{ secrets.MODULE_REPO_TOKEN }}
          SOURCE_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          MODULE_REPOSITORY: Xposed-Modules-Repo/io.github.kiriashi.biopay
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          VERSION_CODE: ${{ needs.release.outputs.version_code }}
        run: python3 .github/scripts/sync_module_repository.py
